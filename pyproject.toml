[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-api"
version = "0.1.0"
description = "Read-only operational API that composes FactoryPulse pipeline outputs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Falcon"}]
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "factorypulse-contracts @ git+https://github.com/david2526IA/factorypulse-contracts.git@ea89cbc7837e356104e73cfbb6276b26479e9732"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
factorypulse-api = "factorypulse_api.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
